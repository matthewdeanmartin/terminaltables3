name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 4.0.1)
        required: true
        type: string
concurrency: changelog
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump versions and open release PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          uvx --from keepachangelog-manager-fork kaclm release-bump \
            --version "$VERSION" --base master --repository "$GITHUB_REPOSITORY" \
            --no-skip-ci --open-pr --title "chore: release ${VERSION}" \
            --body "Merge this release PR before publishing the GitHub draft release." \
            --github-output --yes
      - name: Update release lockfile
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          uv lock
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock release dependencies"
            git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          fi
