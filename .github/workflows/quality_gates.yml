name: Quality Gates

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.15"}
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.15"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Run full quality gates
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: make check
      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        run: uv run --frozen pytest tests --cov=terminaltables3 --cov-branch --cov-report=term-missing --cov-fail-under=95
