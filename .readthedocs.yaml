# Read the Docs build configuration. https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      # Docs dependencies live in the [dependency-groups] "docs" group of pyproject.toml.
      # `pip install --group` needs pip >= 25.1. conf.py puts the repo root on sys.path,
      # so the package itself does not need to be installed.
      - python -m pip install --upgrade pip
      - python -m pip install --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
