[project]
name = "terminaltables3"
version = "4.0.0"
description = "Generate simple tables in terminals from a nested list of strings. Fork of terminaltables."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Robpol86", email = "robpol86@gmail.com"},
    {name = "Matthew Martin", email = "matthewdeanmartin@gmail.com"},
]
keywords = ["Shell", "Bash", "ANSI", "ASCII", "terminal", "tables"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: Terminals",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/matthewdeanmartin/terminaltables3"
Repository = "https://github.com/matthewdeanmartin/terminaltables3"
Documentation = "https://github.com/matthewdeanmartin/terminaltables3"
"Bug Tracker" = "https://github.com/matthewdeanmartin/terminaltables3/issues"
"Change Log" = "https://github.com/matthewdeanmartin/terminaltables3/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit>=1.7.8",
    "black>=24.4.2",
    "check-wheel-contents>=0.6",
    "colorama>=0.3.7",
    "colorclass>=2.2.0",
    "hypothesis>=6.0",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "pillow>=10.3.0",
    "pre-commit>=2",
    "pylint>=3.2.2",
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-snapshot>=0.9.0",
    "pytest-sugar>=0.9.7",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.5",
    "termcolor",
    "vermin>=1.6.0",
]
docs = [
    "myst-parser>=3.0,<4",
    "sphinx>=7.1,<8",
    "sphinx-rtd-theme>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terminaltables3"]

[tool.isort]
profile = "black"

[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
format = "auto"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"
version_files = ["pyproject.toml", "terminaltables3/__init__.py"]
